# 启动的 worker 进程数量
worker_processes  auto;

# 错误日志路径和级别
error_log  /var/log/nginx/error.log warn;

events {
  # 最大连接数
  worker_connections  1024;
}

http {
  # Definisikan tipe file (MIME types)
  types {
    text/html   html htm shtml;
    text/css    css;
    text/javascript js;
    image/jpeg  jpeg jpg;
    image/png   png;
  }

  default_type  application/octet-stream;
  log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
  access_log  /var/log/nginx/access.log  main;
  sendfile        on;
  keepalive_timeout  65;

  # =============================================================
  # KONFIGURASI GZIP TERPUSAT 
  # =============================================================
  gzip on;
  gzip_proxied any; # Memperbaiki typo: proxided -> proxied
  gzip_comp_level 6; # Level kompresi yang seimbang
  gzip_min_length 256; # Jangan kompresi file yang sangat kecil
  gzip_vary on; # Penting untuk caching
  gzip_disable "MSIE [1-6]\."; # Nonaktifkan untuk browser IE lama yang bermasalah

  # Tipe file yang akan dikompresi
  gzip_types
    application/javascript
    application/json
    application/xml
    application/x-javascript
    text/css
    text/javascript
    text/plain;
  # =============================================================

  server {
    listen 8080;
    listen  [::]:8080; 
    server_name  localhost;

    # Hapus semua konfigurasi gzip dari sini karena sudah dipindah ke blok http

    root /xiaoju-survey/web/dist;

    location / {
      try_files $uri $uri/ /management.html;
    }

    # B端页面
    location /management/ {
      try_files $uri $uri/ /management.html;
    }

    # B端预览页 
    location /management/preview/ {
      try_files $uri $uri/ /render.html;
    }

    # C端页面
    location /render/ {
      try_files $uri $uri/ /render.html;
    }

    # server接口
    location /api {
      proxy_pass http://127.0.0.1:3000;
    }

    # server下载模块的文件存储地址
    location /exportfile {
      proxy_pass http://127.0.0.1:3000;
    }
    
    # server上传模块的文件存储地址
    location /userUpload {
      proxy_pass http://127.0.0.1:3000;
    }
    
    error_page 500 502 503 504 /500.html;
    client_max_body_size 20M;
  }
}